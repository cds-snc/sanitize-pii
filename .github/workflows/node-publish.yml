name: Node.js Publish

on:
  release:
    types:
    - published

permissions:
  id-token: write
  contents: read

jobs:
  node-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Audit DNS requests
        uses: cds-snc/dns-proxy-action@58d95c286bfa233aec52055237b26a20c6ae13a5 # v1.2.1
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_SENTINELFORWARDINGMODE: "oidc"
          DNS_PROXY_SENTINELTENANTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_TENANT_ID }}"
          DNS_PROXY_SENTINELCLIENTID: "${{ vars.SENTINEL_FORWARDER_V2_GITHUB_ACTIONS_CLIENT_ID }}"
          DNS_PROXY_SENTINELDCEURI: "${{ secrets.SENTINEL_DCE_ENDPOINT }}"
          DNS_PROXY_SENTINELDCRIMMUTABLEID: "${{ vars.SENTINEL_DCR_RULE_ID_DNS_PROXY }}"
          DNS_PROXY_SENTINELSTREAMNAME: Custom-GitHubMetadata_CI_DNS_Queries_V2_CL
          DNS_PROXY_SAFELIST: "${{ vars.DNS_PROXY_SAFELIST }}"
          DNS_PROXY_WILDCARDGREEDY: "true"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Run build tests
        run: pnpm test:build

      - name: Publish package
        run: pnpm publish --no-git-checks
